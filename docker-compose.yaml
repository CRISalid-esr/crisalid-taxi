version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crisalid-taxi-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=DEV
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./app:/app/app
    command: python -m app.main
