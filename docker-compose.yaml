version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: crisalid-taxi-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - crisalid-taxi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisalid"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crisalid-taxi-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-DEV}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    volumes:
      - ./app:/code/app
    networks:
      - crisalid-taxi-net
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  crisalid-taxi-net:
    driver: bridge

